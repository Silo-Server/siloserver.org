name: Trusted Linux CI

# Runner-group policy allows this file only at refs/heads/main.
# The host controller checks live membership and creates a runner for this run.
on:
  workflow_call:
    inputs:
      self_hosted:
        type: boolean
        required: false
        default: false
      task:
        type: string
        required: true

permissions:
  contents: read

env:
  PREVIEW_PROJECT: siloserver-org


jobs:
  pr-build:
    if: inputs.task == 'pr-build'
    runs-on: ${{ inputs.self_hosted && (github.repository == 'Silo-Server/siloserver.org' && ((github.event_name == 'pull_request' && contains(fromJSON('["MEMBER","OWNER"]'), github.event.pull_request.author_association)) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))) && fromJSON(format('["self-hosted","linux","x64","silo-linux","silo-run-{0}-{1}","silo-job-build"]', github.run_id, github.run_attempt)) || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Match production's per-page documentation dates.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check preview lifecycle
        run: python3 scripts/test-preview-workflows.py

      - name: Build preview
        env:
          # No GITHUB_TOKEN here on purpose. src/data/releases.ts falls back to
          # plain repository links when the release lookup is rate-limited,
          # which is an acceptable difference in a preview and keeps this job
          # free of credentials that contributor code could read.
          #
          # Preview alias: pr-<number>.<project>.pages.dev. Cloudflare repoints
          # it to the newest upload for the branch, so the URL stays stable.
          SITE: https://pr-${{ github.event.pull_request.number }}.${{ env.PREVIEW_PROJECT }}.pages.dev
          BASE_PATH: /
          PUBLIC_PREVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          PUBLIC_PREVIEW_PR_URL: ${{ github.event.pull_request.html_url }}
          PUBLIC_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun run build

      - name: Keep previews out of search indexes
        run: |
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > dist/_headers

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: dist
          retention-days: 3

  site-build:
    if: inputs.task == 'site-build' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ${{ inputs.self_hosted && (github.repository == 'Silo-Server/siloserver.org' && ((github.event_name == 'pull_request' && contains(fromJSON('["MEMBER","OWNER"]'), github.event.pull_request.author_association)) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))) && fromJSON(format('["self-hosted","linux","x64","silo-linux","silo-run-{0}-{1}","silo-job-site-build"]', github.run_id, github.run_attempt)) || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Per-page documentation dates need each file's Git history.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        env:
          # Used by src/data/releases.ts to raise the GitHub API rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Override these in the workflow (or set repo secrets/vars) when
          # the site moves to a custom domain. SITE is the canonical origin
          # used for OpenGraph/sitemap; BASE_PATH is the URL prefix.
          SITE: ${{ vars.SITE || 'https://siloserver.org' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
        run: bun run build

      - name: Record deployment metadata
        run: node scripts/cloudflare-cache.mjs manifest

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
