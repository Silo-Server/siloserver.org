name: Website checks

# Call this workflow through its protected main ref. The runner group must
# restrict access to this file at refs/heads/main before Linux CI is enabled.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  runner:
    name: Choose runner
    runs-on: ubuntu-latest
    outputs:
      use_linux: ${{ steps.route.outputs.use_linux }}
    steps:
      - name: Route from GitHub event metadata
        id: route
        env:
          LINUX_CI_ENABLED: ${{ vars.LINUX_CI_ENABLED }}
        shell: python
        run: |
          import json, os
          from pathlib import Path

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          pull = event.get('pull_request', {})
          head_repo = pull.get('head', {}).get('repo') or {}
          organization_pr = (
              os.environ['GITHUB_EVENT_NAME'] == 'pull_request'
              and pull.get('author_association') in {'MEMBER', 'OWNER'}
              and pull.get('user', {}).get('type') == 'User'
              and head_repo.get('owner', {}).get('login', '').lower() == 'silo-server'
              and pull.get('base', {}).get('ref') == 'main'
          )
          protected_main = (
              os.environ['GITHUB_EVENT_NAME'] in {
                  'push', 'schedule', 'repository_dispatch', 'workflow_dispatch'
              }
              and os.environ.get('GITHUB_REF') == 'refs/heads/main'
          )
          use_linux = (
              os.environ.get('GITHUB_REPOSITORY') == 'Silo-Server/siloserver.org'
              and os.environ.get('LINUX_CI_ENABLED') == 'true'
              and (organization_pr or protected_main)
          )
          # The host broker also verifies live membership and branch protection.
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('use_linux=' + str(use_linux).lower() + '\n')

  site:
    name: Build website
    needs: runner
    runs-on: ${{ needs.runner.outputs.use_linux == 'true' && fromJSON(format('["self-hosted","Linux","X64","linux-ci-{0}-{1}-{2}-website-build"]', github.repository_id, github.run_id, github.run_attempt)) || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Preserve per-page documentation dates and PR merge-candidate testing.
          fetch-depth: 0

      - name: Use persistent Bun downloads
        if: needs.runner.outputs.use_linux == 'true'
        run: echo 'BUN_INSTALL_CACHE_DIR=/cache/bun' >> "$GITHUB_ENV"

      - name: Setup Bun
        if: needs.runner.outputs.use_linux != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify prepared Bun
        if: needs.runner.outputs.use_linux == 'true'
        run: bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check preview lifecycle
        run: python3 scripts/test-preview-workflows.py

      - name: Check runner routing
        run: python3 scripts/test-ci-routing.py

      - name: Build preview
        if: github.event_name == 'pull_request'
        env:
          # Preview code receives no token or deployment credentials.
          SITE: https://pr-${{ github.event.pull_request.number }}.siloserver-org.pages.dev
          BASE_PATH: /
          PUBLIC_PREVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          PUBLIC_PREVIEW_PR_URL: ${{ github.event.pull_request.html_url }}
          PUBLIC_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun run build

      - name: Keep previews out of search indexes
        if: github.event_name == 'pull_request'
        run: |
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > dist/_headers

      - name: Upload preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: dist
          retention-days: 3

      - name: Build site
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE: ${{ vars.SITE || 'https://siloserver.org' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
        run: bun run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
