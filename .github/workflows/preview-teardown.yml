name: Preview teardown

# Deletes a pull request's preview deployments when it is merged or closed,
# and sweeps stale previews weekly. Runs no pull request code, so
# pull_request_target is safe here. It checks out only the trusted deployment
# tooling from the workflow commit, as preview-deploy.yml does.
#
# Cloudflare can keep serving a deleted deployment on its pr-<number> alias for
# a while. Uploading a new deployment is what moves the alias quickly, so on
# close this first publishes a small redirect to siloserver.org and keeps it,
# then deletes everything else. If the alias lags after deletion, it lags on the
# redirect, not on the old preview. The weekly sweep removes the redirect later.
#
# This talks to the Cloudflare REST API rather than `wrangler pages deployment
# list`, because wrangler renames the fields for display (Branch, Deployment)
# and does not expose creation time or paginate. The API returns the raw
# records this needs.

on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# Same lock as deploy: cleanup and its comment must follow publication.
concurrency:
  group: preview-lifecycle
  cancel-in-progress: false
  queue: max

env:
  PREVIEW_PROJECT: siloserver-org

jobs:
  teardown:
    runs-on: ubuntu-latest
    environment: Preview
    steps:
      - name: Check that the pull request is still closed
        if: github.event_name == 'pull_request_target'
        id: state
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: context.payload.pull_request.number,
            });
            core.setOutput('closed', String(pr.state === 'closed'));

      - name: Checkout trusted deployment tooling
        # The redirect steps may fail without blocking deletion: removing the old
        # preview matters more than where its address points afterwards.
        if: github.event_name == 'pull_request_target' && steps.state.outputs.closed == 'true'
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-preview
          sparse-checkout: .github/preview-tools
          persist-credentials: false

      - name: Publish a redirect on the preview address
        if: github.event_name == 'pull_request_target' && steps.state.outputs.closed == 'true'
        id: redirect
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/redirect-deployment.ndjson
        run: |
          set -euo pipefail
          npm ci --prefix trusted-preview/.github/preview-tools --no-audit --no-fund

          # Every page goes to the same path in production. A page that only
          # existed in this pull request gets the site's normal 404 page there.
          site="${RUNNER_TEMP}/redirect-site"
          rm -rf "$site" && mkdir -p "$site"
          printf '/*  https://siloserver.org/:splat  302\n' > "$site/_redirects"
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > "$site/_headers"
          # Wrangler needs at least one asset. This page is never reached while
          # the redirect rule applies.
          printf '<!doctype html><meta name="robots" content="noindex"><meta http-equiv="refresh" content="0; url=https://siloserver.org/"><title>Preview removed</title><a href="https://siloserver.org/">Preview removed. Go to siloserver.org</a>\n' > "$site/404.html"

          rm -f "$WRANGLER_OUTPUT_FILE_PATH"
          trusted-preview/.github/preview-tools/node_modules/.bin/wrangler pages deploy "$site" \
            --project-name="$PREVIEW_PROJECT" --branch="pr-$PR_NUMBER" \
            --commit-message="Preview removed" --commit-dirty=true
          id="$(jq -r --arg p "$PREVIEW_PROJECT" 'select(.type == "pages-deploy" and .pages_project == $p) | .deployment_id // empty' "$WRANGLER_OUTPUT_FILE_PATH")"
          if [ -z "$id" ] || [ "$(wc -l <<<"$id")" -ne 1 ]; then
            echo "Wrangler did not return exactly one deployment ID." >&2
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Wait for the preview address to redirect
        if: steps.redirect.outputs.id != ''
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          url="https://pr-${PR_NUMBER}.${PREVIEW_PROJECT}.pages.dev/"
          for attempt in $(seq 1 36); do
            got="$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "$url" || true)"
            case "$got" in
              "302 https://siloserver.org/"*) echo "Preview address redirects: $got"; exit 0 ;;
            esac
            sleep 5
          done
          echo "::warning::${url} did not redirect within 3 minutes (last response: ${got}). Deleting the old preview anyway."

      - name: Delete previews
        if: github.event_name != 'pull_request_target' || steps.state.outputs.closed == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Set for pull request closes; empty for the scheduled sweep.
          PR_BRANCH: ${{ github.event.pull_request && format('pr-{0}', github.event.pull_request.number) || '' }}
          MAX_AGE_DAYS: "30"
          # The redirect published above. Empty if that step failed or skipped.
          KEEP_ID: ${{ steps.redirect.outputs.id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${PREVIEW_PROJECT}/deployments"

          if [ -n "$PR_BRANCH" ]; then
            filter='.result[] | select(((.deployment_trigger.metadata.branch // "") == $b) and (.id != $keep)) | .id'
          else
            filter='.result[] | select(((.deployment_trigger.metadata.branch // "") | startswith("pr-")) and ((.created_on | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) < (now - ($days | tonumber) * 86400))) | .id'
          fi

          : > ids.txt
          page=1
          while : ; do
            resp="$(curl -sS -H "Authorization: Bearer ${CF_API_TOKEN}" \
              "${api}?env=preview&page=${page}&per_page=25")"
            if [ "$(jq -r '.success' <<<"$resp")" != "true" ]; then
              jq -r '.errors' <<<"$resp" >&2
              exit 1
            fi
            count="$(jq '.result | length' <<<"$resp")"
            [ "$count" -eq 0 ] && break
            jq -r --arg b "$PR_BRANCH" --arg days "$MAX_AGE_DAYS" --arg keep "${KEEP_ID:-}" "$filter" <<<"$resp" >> ids.txt
            page=$((page + 1))
          done

          total="$(wc -l < ids.txt | tr -d ' ')"
          if [ "$total" -eq 0 ]; then
            echo "No preview deployments to delete."
            exit 0
          fi
          echo "Deleting ${total} preview deployment(s)."
          failed=0
          while read -r id; do
            [ -n "$id" ] || continue
            out="$(curl -sS -X DELETE -H "Authorization: Bearer ${CF_API_TOKEN}" \
              "${api}/${id}?force=true")"
            if [ "$(jq -r '.success' <<<"$out")" = "true" ]; then
              echo "  deleted ${id}"
            elif jq -e '(.errors | type == "array") and (.errors | length > 0) and all(.errors[]; .code == 8000009)' <<<"$out" >/dev/null; then
              echo "  already removed ${id}"
            else
              echo "  FAILED ${id}: $(jq -c '.errors' <<<"$out")" >&2
              failed=1
            fi
          done < ids.txt
          exit "$failed"

      - name: Update the pull request comment
        if: github.event_name == 'pull_request_target' && steps.state.outputs.closed == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          number: ${{ github.event.pull_request.number }}
          header: preview
          message: |
            Preview removed after this pull request was closed.${{ steps.redirect.outputs.id && ' Its address now redirects to siloserver.org.' || '' }}
