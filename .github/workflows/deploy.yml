name: Deploy site

on:
  # Rebuild when site code changes.
  push:
    branches: [main]
  # Rebuild every 6 hours so version numbers stay fresh even if
  # cross-repo dispatches are missed.
  schedule:
    - cron: "0 */6 * * *"
  # Rebuild when a sibling repo publishes a release.
  # See README for how to wire this up in each silo-* repo.
  repository_dispatch:
    types: [release-published]
  # Manual trigger from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow at most one concurrent deploy, but don't cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    uses: Silo-Server/siloserver.org/.github/workflows/trusted-linux-ci.yml@main
    with:
      self_hosted: false
      task: site-build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout deployment scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Purge and verify the website cache
        timeout-minutes: 10
        env:
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          SITE: ${{ vars.SITE || 'https://siloserver.org' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
        run: node scripts/cloudflare-cache.mjs purge
