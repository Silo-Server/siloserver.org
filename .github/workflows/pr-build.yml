name: PR build

# Unprivileged: runs pull request code (including from forks) with NO secrets
# and no write permissions. It builds the site as a preview and hands the
# output to preview-deploy.yml via an artifact. Also the required build check.
#
# Do not add secrets, tokens, or write permissions to this workflow. The
# preview deployment's safety depends on this job being untrusted.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PREVIEW_PROJECT: siloserver-org

jobs:
  build:
    uses: Silo-Server/siloserver.org/.github/workflows/trusted-linux-ci.yml@main
    with:
      self_hosted: ${{ github.repository == 'Silo-Server/siloserver.org' && ((github.event_name == 'pull_request' && contains(fromJSON('["MEMBER","OWNER"]'), github.event.pull_request.author_association)) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) }}
      task: pr-build
