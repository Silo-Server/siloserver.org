name: Preview deploy

# Privileged: runs on the default branch with repository secrets, after
# "PR build" finishes. It never checks out or executes pull request code; it
# only downloads the built artifact and uploads it to Cloudflare Pages.

on:
  workflow_run:
    workflows: ["PR build"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read

env:
  PREVIEW_PROJECT: temp-siloserver-org

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    # Cloudflare credentials live in this environment, not at repository level,
    # so the unprivileged PR build cannot read them.
    environment: Preview
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: preview-site
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download context
        uses: actions/download-artifact@v4
        with:
          name: preview-meta
          path: meta
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read context
        id: ctx
        run: |
          pr="$(tr -dc '0-9' < meta/pr-number)"
          sha="$(tr -dc 'a-f0-9' < meta/sha)"
          test -n "$pr" && test -n "$sha"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PREVIEW_PROJECT }} --branch=pr-${{ steps.ctx.outputs.pr }} --commit-hash=${{ steps.ctx.outputs.sha }} --commit-dirty=true

      - name: Comment on the pull request
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          number: ${{ steps.ctx.outputs.pr }}
          header: preview
          message: |
            **Preview deployed:** https://pr-${{ steps.ctx.outputs.pr }}.${{ env.PREVIEW_PROJECT }}.pages.dev

            | | |
            | --- | --- |
            | Commit | `${{ steps.ctx.outputs.short }}` |
            | Built | ${{ github.event.workflow_run.updated_at }} |
            | This upload | ${{ steps.deploy.outputs.deployment-url }} |

            The alias above always shows the latest push. The preview is removed when this pull request closes.

      - name: Report status on the commit
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.ctx.outputs.sha }}',
              state: 'success',
              context: 'preview',
              description: 'Preview deployed',
              target_url: 'https://pr-${{ steps.ctx.outputs.pr }}.${{ env.PREVIEW_PROJECT }}.pages.dev',
            });
